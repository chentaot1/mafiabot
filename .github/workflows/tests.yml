name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Regression tests
        run: python -m pytest -ra
      - name: Standalone smoke suite
        run: python smoke_test.py
      - name: Bounded engine checks
        run: python scripts/sim_test.py --skip-exhaustive --fuzz-iterations 200 --seed 12345
      - name: Simulator role audit
        run: python scripts/monte_carlo_sim.py --audit
